services:
  - type: web
    name: ai-gateway-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    # Migrations run before the new version serves traffic. create_all was
    # removed from the app, so without this a deploy boots against an
    # unmigrated database and every database-backed route fails.
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # /ready, not /health. Liveness only proves the process booted; readiness
    # also checks the database. Pointing this at /health is how a broken
    # instance ends up receiving production traffic.
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Production Postgres (Neon) presents a valid certificate, so TLS stays
      # on with verification. Never disable this in a deployed environment.
      - key: DATABASE_SSL
        value: require
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false