name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + routing eval)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the production Postgres major version. NOT NULL became a
        # catalog constraint in PG17, so running migrations on PG16 and
        # deploying to PG18 leaves a real gap in what CI can catch.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: gwuser
          POSTGRES_PASSWORD: gwpass
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://gwuser:gwpass@localhost:5432/gateway_test
      # The CI service container presents a self-signed certificate.
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check migrations match models
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic check
      - name: Run routing quality eval
        # Thresholds live in backend/evals/baseline_gates.json, not here, so
        # that every number they were derived from sits in one reviewable file
        # next to the gate it produced. That file also records which metrics are
        # deliberately not gated and why.
        #
        # The previous floor was 0.90 against an 18-case golden set the router
        # scored 18/18 on. That 100% measured the test set, not the router: six
        # of those eighteen cases are near-copies of the router's own regexes and
        # none exercised multi-turn input. Against the 379-case set the honest
        # overall accuracy is 0.533 and the committed floors are 0.49 overall,
        # 0.52 clear, 0.40 ambiguous, 0.40 adversarial, each derived as
        # floor(observed - 1.3 * standard error). Raising the floor back to 0.90
        # would require weakening the dataset, and weakening the dataset to pass
        # a gate is how an eval becomes theatre.
        run: python -m evals.run --load-baseline backend/evals/baseline_gates.json

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build